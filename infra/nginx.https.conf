# 生产用的 Nginx 配置：HTTP 强制跳转 HTTPS，443 提供站点。
# 证书由 acme.sh 签发后安装到 ../certs（fullchain.pem / privkey.pem），
# 挂载到容器 /etc/nginx/certs。
server {
  listen 80;
  server_name timomo.store www.timomo.store;

  # ACME 校验路径保留明文，用于证书续期
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # 备案已通过（粤ICP备2026167701号），全站强制 HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name timomo.store www.timomo.store;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_prefer_server_ciphers off;

  # HSTS：域名固定后开启，让浏览器记住只走 HTTPS
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # 静态资源带指纹，可长缓存；index.html 不缓存，保证发布后立即生效
  location ~* \.(js|css|woff2?|png|svg|jpg|jpeg|webp)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
