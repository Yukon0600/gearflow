# 生产用的 Nginx 配置：HTTP 跳转 HTTPS，443 提供站点。
# 证书由 acme.sh 签发后安装到 ../certs（fullchain.pem / privkey.pem），
# 挂载到容器 /etc/nginx/certs。
server {
  listen 80;
  server_name timomo.store www.timomo.store;

  # 备案期间 80 端口会被阿里云拦截（返回 403 Beaver），这里保留 ACME 路径，
  # 等备案通过后可以改用它做 HTTP-01 续期。
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # 备案通过后打开下面这行，强制跳转 HTTPS：
  # return 301 https://$host$request_uri;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name timomo.store www.timomo.store;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_prefer_server_ciphers off;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
